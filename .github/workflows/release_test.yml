name: RELEASE TEST
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Step 1
        shell: cmd
        id: s
        run: |
          for /F %%l in (%GITHUB_ENV%) do (echo %%l)
          echo "MY_VAR=MY_VAR_DATA" >> "$GITHUB_ENV"
      - name: Step 2
        shell: cmd
        id: s2
        run: |
          echo $MY_VAR
          echo $MY_VAR2
          printf '%s\n' "$MY_VAR"

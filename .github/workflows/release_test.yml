name: RELEASE TEST
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare
        shell: cmd
        run: |
          echo BLAH > blah.txt
          7z a -sdel -mx0 -mhe check.7z blah.txt
          dir
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          overwrite_files: false
          name:
          tag_name: ${{github.run_id}}_${{github.run_attempt}}
          files: "*.7z"
